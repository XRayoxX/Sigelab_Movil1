spring.application.name=sigelab-api
server.port=${PORT:8080}
spring.config.import=optional:file:./api/application-local.properties,optional:file:./application-local.properties
spring.datasource.url=${SIGELAB_DB_URL:${sigelab.desktop.db.url:}}
spring.datasource.username=${SIGELAB_DB_USER:${sigelab.desktop.db.username:}}
spring.datasource.password=${SIGELAB_DB_PASSWORD:${sigelab.desktop.db.password:}}
spring.datasource.hikari.maximum-pool-size=5
server.error.include-message=never

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=24MB
